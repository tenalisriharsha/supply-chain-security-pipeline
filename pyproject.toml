[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-engine"
version = "0.1.0"
description = "Policy evaluation engine for the supply-chain security pipeline"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
policy-engine = "policy_engine.cli:main"

[tool.setuptools]
packages = ["policy_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
